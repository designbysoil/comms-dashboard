<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>QF Design System — Communications Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  
  <style>
    /* QF Font - Variable Font */
    @font-face {
      font-family: 'QF Font';
      src: url('QF-VF.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* Apply QF Font to body */
    body {
      font-family: 'QF Font', system-ui, -apple-system, sans-serif;
    }

    /* Smooth scrolling */
    html { scroll-behavior: smooth; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel" data-presets="react,env">
    const { useState } = React;

    // =============================================================================
    // QF COMMUNICATIONS DASHBOARD — DESIGN SYSTEM v2.6
    // =============================================================================

    // ─────────────────────────────────────────────────────────────────────────────
    // HELPER COMPONENTS
    // ─────────────────────────────────────────────────────────────────────────────

    const ColorSwatch = ({ color, name, hex, size = 'default' }) => {
      const [copied, setCopied] = useState(false);
      
      const copyToClipboard = () => {
        navigator.clipboard.writeText(hex);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };

      const isLight = (hexColor) => {
        const r = parseInt(hexColor.slice(1, 3), 16);
        const g = parseInt(hexColor.slice(3, 5), 16);
        const b = parseInt(hexColor.slice(5, 7), 16);
        return (r * 299 + g * 587 + b * 114) / 1000 > 128;
      };
      
      const heights = { small: 'h-12', default: 'h-16', large: 'h-20' };
      
      return (
        <div className="cursor-pointer group relative" onClick={copyToClipboard}>
          <div 
            className={`${heights[size]} rounded-lg border border-black/5 transition-all group-hover:scale-105 group-hover:shadow-md flex items-end p-2`}
            style={{ backgroundColor: color }}
          >
            <span className={`text-xs font-medium ${isLight(color) ? 'text-gray-700' : 'text-white/80'}`}>
              {name}
            </span>
          </div>
          <p className="text-xs text-gray-500 font-mono mt-1 text-center">{hex}</p>
          {copied && (
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#0B241C] text-white text-xs px-2 py-1 rounded z-10">
              Copied!
            </div>
          )}
        </div>
      );
    };

    const Tooltip = ({ children, visible, position = 'top' }) => {
      if (!visible) return null;
      const positions = {
        top: 'bottom-full left-1/2 -translate-x-1/2 mb-2',
        center: 'top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2',
        right: 'left-full top-1/2 -translate-y-1/2 ml-2',
      };
      return (
        <div className={`absolute ${positions[position]} bg-white border border-[#E8E8E5] rounded-lg shadow-lg px-4 py-3 pointer-events-none z-20 whitespace-nowrap`}>
          {children}
        </div>
      );
    };

    // IBM Carbon Icons for code copy button
    const CodeIcon = () => (
      <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor">
        <polygon points="31 16 24 23 22.59 21.59 28.17 16 22.59 10.41 24 9 31 16"/>
        <polygon points="1 16 8 9 9.41 10.41 3.83 16 9.41 21.59 8 23 1 16"/>

        <polygon points="13 24 4 15 5.414 13.586 13 21.171 26.586 7.586 28 9 13 24"/>

    // Download icon (IBM Carbon)

      <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor">

    // Function to download the HTML file
    const downloadDesignSystem = () => {
      const htmlContent = document.documentElement.outerHTML;
      const blob = new Blob(['<!DOCTYPE html>\n' + htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qf-design-system.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

        { name: 'Email', value: 5000, percent: 2, color: theme.donut6[5] },
      ];
      
      const getPointOnCircle = (percent, offset, radius) => {
        const angle = ((offset + percent / 2) / 100) * 360 - 90;
        const rad = angle * Math.PI / 180;
        return {
          x: 150 + radius * Math.cos(rad),
          y: 150 + radius * Math.sin(rad)
        };
      };

      let cumulativePercent = 0;
      const segments = data.map(d => {
        const segment = { ...d, offset: cumulativePercent };
        cumulativePercent += d.percent;
        return segment;

                  const strokeDash = (segment.percent / 100) * circumference;
                  const strokeOffset = -(segment.offset / 100) * circumference;
                  const labelPoint = getPointOnCircle(segment.percent, segment.offset, 120);
                  const isLeft = labelPoint.x < 150;
                  
                  return (

                      <circle 
                        cx="150" cy="150" r="70" 
                        fill="none" 
                        stroke={segment.color} 
                        strokeWidth="35"
                        strokeDasharray={`${strokeDash} ${circumference}`} 
                        strokeDashoffset={strokeOffset}
                        transform="rotate(-90 150 150)" 
                        opacity={hovered !== null && hovered !== i ? 0.4 : 1}
                        className="transition-opacity duration-200 cursor-pointer"
                        onMouseEnter={() => setHovered(i)}

                        textAnchor={isLeft ? 'end' : 'start'}
                        fill="#4A7561"
                        fontSize="10"
                      >
                        {segment.percent}%
                      </text>
                    </g>

        { name: 'Crypto', value: 36, size: 79, x: 175, y: 230, color: '#C4B49A' },
      ];

      // Helper to wrap text into multiple lines based on available width
      const wrapText = (text, maxWidth) => {
        const words = text.split(' ');
        if (words.length === 1) return [text];

        const lines = [];
        let currentLine = '';

        words.forEach(word => {
          const testLine = currentLine ? `${currentLine} ${word}` : word;
          const testWidth = testLine.length * 6;

          if (testWidth > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = word;
          } else {
            currentLine = testLine;
          }
        });

        if (currentLine) lines.push(currentLine);
        return lines;
      };

      // Calculate font size based on circle size
      const getFontSize = (size, isValue = false) => {
        const radius = size / 2;
        if (isValue) {
          return Math.max(10, Math.min(16, radius * 0.18));
        }
        return Math.max(10, Math.min(16, radius * 0.20));

              const nameFontSize = getFontSize(item.size);
              const valueFontSize = getFontSize(item.size, true);
              const lineHeight = nameFontSize * 1.2;
              const totalTextHeight = (nameLines.length * lineHeight) + valueFontSize + 4;

                        <p>Dashboards are not marketing materials. The job of color here is not to excite or attract attention — it's to create enough visual calm that the data can do the talking. When colors compete with numbers, people have to work harder to extract meaning. When colors recede into the background, the numbers float forward naturally.</p>

                        <p>In short: Sidra Green is the brand voice. Sage is the data voice. They're related but they serve different masters.</p>
